name: Update Ransomware Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ransomware-intelligence
  cancel-in-progress: false

jobs:
  update-ransomware:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Collect ransomware intelligence (public API, no key)
        run: node scripts/fetch-ransomware.js

      - name: Show ransomware freshness summary
        run: |
          node -e "const d=require('./data/ransomware.json'); console.log('Source:',d.meta.source,d.meta.mode); console.log('Latest claim:',d.meta.latestVictimDiscovered,d.meta.latestVictimName); console.log('Feed freshness:',d.meta.feedFreshness,'age(min):',d.meta.sourceDataAgeMinutes); console.log('New claims:',d.meta.newClaimsSincePreviousCollection);"

      - name: Commit changed ransomware intelligence
        run: |
          git config --global user.name "Cyber Intelligence Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ransomware.json data/ransomware-history.json
          git diff --cached --quiet || git commit -m "Update ransomware intelligence"
          git push
