name: Enrich NVD Vulnerability Intelligence

on:
  workflow_dispatch:
  schedule:
    # NVD recommends automated maintenance no more than once every two hours.
    # Minute 17 avoids the busy top-of-hour GitHub Actions window.
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  update-nvd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect NVD KEV enrichment
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/fetch-nvd-kev.js

      - name: Commit changed NVD intelligence
        run: |
          git config user.name "cti-intel-bot"
          git config user.email "cti-intel-bot@users.noreply.github.com"
          git add data/nvd.json
          if git diff --cached --quiet; then
            echo "No NVD intelligence changes to commit."
          else
            git commit -m "chore: update NVD vulnerability intelligence"
            git push
          fi
