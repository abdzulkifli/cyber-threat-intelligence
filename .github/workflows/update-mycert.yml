name: Update MyCERT Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-mycert-intelligence
  cancel-in-progress: false

jobs:
  update-mycert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Collect MyCERT advisories
        run: node scripts/fetch-mycert.js

      - name: Commit changed MyCERT intelligence
        run: |
          git config --global user.name "Cyber Intelligence Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mycert.json
          git diff --cached --quiet || git commit -m "Update MyCERT threat intelligence"
          git push
